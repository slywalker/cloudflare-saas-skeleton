# CI: typecheck, test, build, and dependency audit.
# Deployment is handled by Cloudflare Workers Builds (configured in the
# Cloudflare dashboard), not by GitHub Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packageManager フィールド (package.json) からバージョンを解決する。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # @cloudflare/vitest-pool-workers 経由で workerd (miniflare) 上でテストを実行する。
      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # 既知の脆弱性(high以上)が紛れ込んでいないかを毎回確認する。
      # 失敗した場合はCIを red にして人間が確認する運用とする。
      - name: Audit dependencies (prod, high+)
        run: pnpm audit --prod --audit-level high
