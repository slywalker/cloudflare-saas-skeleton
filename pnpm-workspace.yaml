# pnpm ワークスペース設定。単一パッケージ構成だが、pnpm 10.x/11.x では
# minimumReleaseAge / onlyBuiltDependencies 等の設定はここに書く仕様
# (.npmrc や package.json の "pnpm" フィールドではない)。
packages:
  - "."

# サプライチェーン対策: 依存が公開されてから最低7日 (10080分) 経過するまで
# インストールを許可しない (typosquatting/乗っ取り直後の悪意あるバージョンを
# 誤って取り込むリスクを下げる)。詳細は README のセキュリティ節を参照。
minimumReleaseAge: 10080

# pnpm は既定で依存の preinstall/install/postinstall スクリプトを
# ブロックする (サプライチェーン攻撃対策)。ビルド (ネイティブバイナリ取得等)
# に本当に必要な依存のみ、ここに明示的に許可を列挙する。
# 一覧・理由は README のセキュリティ節を参照。
onlyBuiltDependencies:
  - esbuild
  - workerd

# バージョン固定 (pnpm 10.x は package.json の "pnpm.overrides" ではなく
# ワークスペースファイル側の overrides もサポートするため、規約通りここに
# 集約する)。Cloudflare 系パッケージ (`wrangler`/`@cloudflare/workers-types`
# 等) はほぼ毎日リリースされるため、`minimumReleaseAge` の判定対象になる
# 推移的依存が「7日以内に公開されたバージョンしか存在しない」状態に頻繁に
# 陥る。これを回避するため、7日以上経過した mature なバージョンへ明示的に
# 固定している (詳細は README のセキュリティ節参照)。
overrides:
  # vite の内部依存。現行 vite が要求する range (~1.2.1 相当) の中で mature な
  # 版に固定。この固定は vite 側の要求 range が変わったら追随して見直すこと
  # (range 外になると `pnpm install` が解決エラーになるため、更新を機械的に
  # 検知できる)。
  rolldown: 1.2.3
  # wrangler/better-auth 系が要求する `>=4`/`^5.x` 範囲内で mature な版に固定。
  "@cloudflare/workers-types": 5.20260804.1
